<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Notas Adhesivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3efe6;
    --dot: #d9d2c3;
    --ink: #2b2b2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
    overflow: hidden;
  }

  /* Barra superior */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 20px;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(8px);
    box-shadow: 0 1px 0 rgba(0,0,0,.08);
  }
  header h1 {
    font-family: 'Caveat', cursive; font-size: 30px; margin: 0 12px 0 0; line-height: 1;
  }
  .btn {
    border: none; border-radius: 10px; padding: 9px 14px; cursor: pointer;
    font: 600 14px 'Inter', sans-serif; background: #2b2b2b; color: #fff;
    transition: transform .1s, opacity .2s;
  }
  .btn:hover { opacity: .88; }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid #ccc; }
  .palette { display: flex; gap: 6px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .swatch.active { border-color: #2b2b2b; }
  #search {
    margin-left: auto; padding: 9px 12px; border-radius: 10px; border: 1px solid #ccc;
    font: 14px 'Inter', sans-serif; min-width: 180px; background: #fff;
  }
  #count { font-size: 13px; color: #777; }

  /* Tablero */
  #board { position: absolute; inset: 0; padding-top: 70px; }
  .empty {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; color: #999; font-family: 'Caveat', cursive; font-size: 32px;
    pointer-events: none;
  }

  /* Nota */
  .note {
    position: absolute; width: 220px; min-height: 200px;
    padding: 34px 14px 14px;
    border-radius: 3px 3px 18px 3px;
    box-shadow: 0 8px 18px rgba(0,0,0,.14), 0 2px 4px rgba(0,0,0,.08);
    display: flex; flex-direction: column;
    transition: box-shadow .2s, transform .15s;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.6) rotate(var(--rot)); opacity: 0; } }
  .note { transform: rotate(var(--rot)); }
  .note.dragging {
    transform: rotate(0deg) scale(1.04);
    box-shadow: 0 18px 34px rgba(0,0,0,.25);
    transition: none; cursor: grabbing;
  }
  .note.hidden { display: none; }
  .note .bar {
    position: absolute; top: 0; left: 0; right: 0; height: 30px;
    display: flex; align-items: center; justify-content: flex-end; gap: 2px;
    padding: 0 6px; cursor: grab; touch-action: none;
    background: rgba(0,0,0,.05);
  }
  .note .bar button {
    background: none; border: none; cursor: pointer; font-size: 15px;
    width: 26px; height: 26px; border-radius: 6px; opacity: .55;
  }
  .note .bar button:hover { opacity: 1; background: rgba(0,0,0,.08); }
  .note .pin-icon { margin-right: auto; font-size: 14px; opacity: .8; }
  .note textarea {
    flex: 1; width: 100%; min-height: 140px; resize: none;
    border: none; outline: none; background: transparent;
    font: 600 22px/1.25 'Caveat', cursive; color: var(--ink);
  }
  .note textarea::placeholder { color: rgba(0,0,0,.35); }
  .note .meta { font-size: 11px; color: rgba(0,0,0,.4); text-align: right; margin-top: 6px; }
  .note .colors {
    position: absolute; top: 32px; right: 6px; display: none; gap: 4px;
    background: #fff; padding: 6px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.18);
    z-index: 2;
  }
  .note .colors.open { display: flex; }
  .note .colors span { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .note.pinned .bar { cursor: default; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #2b2b2b; color: #fff; padding: 10px 14px; border-radius: 10px;
    display: flex; gap: 12px; align-items: center; font-size: 14px; z-index: 10001;
    transition: transform .25s;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast button { background: none; border: none; color: #ffd84d; font-weight: 600; cursor: pointer; }

  @media (max-width: 640px) {
    #search { margin-left: 0; flex: 1; }
    
  }
</style>
</head>
<body>

<header>
  <h1>📌 Mis Notas</h1>
  <button class="btn" id="addBtn" title="Nueva nota (N)">+ Nueva nota</button>
  <div class="palette" id="palette"></div>
  <span id="count"></span>
  <input id="search" type="search" placeholder="🔍 Buscar notas...">
  <button class="btn ghost" id="exportBtn" title="Descargar copia de seguridad">⬇ Exportar</button>
  <button class="btn ghost" id="importBtn" title="Cargar copia de seguridad">⬆ Importar</button>
  <input type="file" id="fileInput" accept="application/json" hidden>
</header>

<main id="board"></main>
<div id="toast"><span id="toastMsg"></span><button id="undoBtn">Deshacer</button></div>

<script>
const COLORS = ['#fff475', '#ffb3c7', '#a7f3d0', '#a5d8ff', '#ffd8a8', '#d0bfff', '#ffffff'];
const KEY = 'notas-adhesivas-v1';
const board = document.getElementById('board');
let notes = load();
let selectedColor = COLORS[0];
let topZ = Math.max(1, ...notes.map(n => n.z || 1));
let lastDeleted = null, toastTimer;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(notes));
  updateCount();
}
function headerH() { return document.querySelector('header').offsetHeight + 10; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmt(ts) {
  return new Date(ts).toLocaleString('es', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

/* Paleta de la barra superior */
const palette = document.getElementById('palette');
COLORS.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' active' : '');
  s.style.background = c;
  s.title = 'Color para nuevas notas';
  s.onclick = () => {
    selectedColor = c;
    palette.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
  };
  palette.appendChild(s);
});

function addNote(x, y) {
  const w = board.clientWidth, h = board.clientHeight;
  const note = {
    id: uid(),
    text: '',
    color: selectedColor,
    x: x ?? Math.max(10, Math.random() * (w - 260)),
    y: Math.max(headerH(), y ?? headerH() + Math.random() * Math.max(0, h - headerH() - 240)),
    rot: (Math.random() * 6 - 3).toFixed(1),
    z: ++topZ,
    pinned: false,
    updated: Date.now()
  };
  notes.push(note);
  save();
  const el = renderNote(note);
  el.querySelector('textarea').focus();
}

function renderNote(note) {
  const el = document.createElement('div');
  el.className = 'note' + (note.pinned ? ' pinned' : '');
  el.dataset.id = note.id;
  el.style.left = note.x + 'px';
  el.style.top = note.y + 'px';
  el.style.zIndex = note.z;
  el.style.background = note.color;
  el.style.setProperty('--rot', note.rot + 'deg');
  el.innerHTML = `
    <div class="bar">
      <span class="pin-icon">${note.pinned ? '📌' : ''}</span>
      <button data-act="pin" title="Fijar / soltar">${note.pinned ? '🔓' : '📍'}</button>
      <button data-act="color" title="Cambiar color">🎨</button>
      <button data-act="del" title="Eliminar">✕</button>
    </div>
    <div class="colors">${COLORS.map(c => `<span style="background:${c}" data-c="${c}"></span>`).join('')}</div>
    <textarea placeholder="Escribe algo..."></textarea>
    <div class="meta">${fmt(note.updated)}</div>`;
  const ta = el.querySelector('textarea');
  ta.value = note.text;
  ta.addEventListener('input', () => {
    note.text = ta.value;
    note.updated = Date.now();
    el.querySelector('.meta').textContent = fmt(note.updated);
    save();
  });
  el.addEventListener('mousedown', () => bringToFront(note, el));

  el.querySelector('.bar').addEventListener('click', e => {
    const act = e.target.dataset.act;
    if (act === 'del') deleteNote(note, el);
    if (act === 'color') el.querySelector('.colors').classList.toggle('open');
    if (act === 'pin') {
      note.pinned = !note.pinned;
      save();
      el.replaceWith(renderNote(note));
    }
  });
  el.querySelector('.colors').addEventListener('click', e => {
    const c = e.target.dataset.c;
    if (!c) return;
    note.color = c; el.style.background = c; save();
    e.currentTarget.classList.remove('open');
  });

  makeDraggable(el, note);
  board.appendChild(el);
  applySearch();
  updateEmpty();
  return el;
}

function bringToFront(note, el) {
  if (note.z === topZ) return;
  note.z = ++topZ; el.style.zIndex = note.z; save();
}

function makeDraggable(el, note) {
  const bar = el.querySelector('.bar');
  bar.addEventListener('pointerdown', e => {
    if (e.target.tagName === 'BUTTON' || note.pinned) return;
    e.preventDefault();
    bar.setPointerCapture(e.pointerId);
    bringToFront(note, el);
    el.classList.add('dragging');
    const startX = e.clientX - note.x, startY = e.clientY - note.y;
    const move = ev => {
      note.x = Math.min(Math.max(0, ev.clientX - startX), window.innerWidth - 60);
      note.y = Math.min(Math.max(headerH(), ev.clientY - startY), window.innerHeight - 40);
      el.style.left = note.x + 'px';
      el.style.top = note.y + 'px';
    };
    const up = () => {
      el.classList.remove('dragging');
      bar.removeEventListener('pointermove', move);
      bar.removeEventListener('pointerup', up);
      save();
    };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
}

function deleteNote(note, el) {
  if (note.text.trim() && !confirm('¿Eliminar esta nota?')) return;
  notes = notes.filter(n => n.id !== note.id);
  lastDeleted = note;
  el.remove();
  save(); updateEmpty();
  showToast('Nota eliminada');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}
document.getElementById('undoBtn').onclick = () => {
  if (!lastDeleted) return;
  notes.push(lastDeleted); save(); renderNote(lastDeleted); lastDeleted = null;
  document.getElementById('toast').classList.remove('show');
};

function updateCount() {
  document.getElementById('count').textContent = notes.length === 1 ? '1 nota' : `${notes.length} notas`;
}
function updateEmpty() {
  let e = board.querySelector('.empty');
  if (!notes.length && !e) {
    e = document.createElement('div'); e.className = 'empty';
    e.innerHTML = 'No tienes notas todavía ✏️<br><small>Pulsa “+ Nueva nota” o haz doble clic en el tablero</small>';
    board.appendChild(e);
  } else if (notes.length && e) e.remove();
}

/* Búsqueda */
const search = document.getElementById('search');
function applySearch() {
  const q = search.value.trim().toLowerCase();
  board.querySelectorAll('.note').forEach(el => {
    const n = notes.find(x => x.id === el.dataset.id);
    el.classList.toggle('hidden', !!q && !n.text.toLowerCase().includes(q));
  });
}
search.addEventListener('input', applySearch);

/* Exportar / importar */
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mis-notas-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
const fileInput = document.getElementById('fileInput');
document.getElementById('importBtn').onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const f = fileInput.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    if (!confirm(`¿Reemplazar tus notas actuales por ${data.length} notas importadas?`)) return;
    notes = data; save();
    board.querySelectorAll('.note').forEach(n => n.remove());
    notes.forEach(renderNote); updateEmpty();
  } catch { alert('El archivo no es válido.'); }
  fileInput.value = '';
};

/* Atajos */
document.getElementById('addBtn').onclick = () => addNote();
board.addEventListener('dblclick', e => {
  if (e.target === board) addNote(e.clientX - 110, Math.max(70, e.clientY - 20));
});
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'n' && !['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName)) {
    e.preventDefault(); addNote();
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.colors') && e.target.dataset.act !== 'color')
    document.querySelectorAll('.colors.open').forEach(c => c.classList.remove('open'));
});

/* Inicio */
notes.forEach(renderNote);
updateCount(); updateEmpty();
</script>
</body>
</html>
